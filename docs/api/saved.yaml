module: Saved
owner: M3
base_path: /v1/saved
authentication: Firebase ID token in Authorization: Bearer <token>
authorization: athlete role required; all queries are scoped to the verified current user
success_envelope:
  data: response payload
  meta:
    next_cursor: string or null
    request_id: string
error_envelope:
  error:
    code: string
    message: string
    details: list
    request_id: string or null
endpoints:
  - method: POST
    path: /v1/saved
    body:
      type: opportunity|event
      target_id: public identifier
    response: saved item; repeated saves return the existing item without duplicating it
    errors: 401 AUTH_REQUIRED, 403 FORBIDDEN, 404 NOT_FOUND, 422 VALIDATION_ERROR
  - method: DELETE
    path: /v1/saved/{type}/{target_id}
    response: 204; deleting a missing item is successful
    errors: 401 AUTH_REQUIRED, 403 FORBIDDEN, 422 VALIDATION_ERROR
  - method: GET
    path: /v1/saved
    query:
      type: optional opportunity|event
      limit: 1..50, default 20
      cursor: optional opaque ObjectId cursor
    response: newest-first page of SavedItem records
    SavedItem:
      type: opportunity|event
      target_id: public identifier
      saved_at: UTC datetime
      available: boolean
      summary: target summary or null when target no longer exists
    errors: 401 AUTH_REQUIRED, 403 FORBIDDEN, 422 VALIDATION_ERROR or INVALID_CURSOR
storage:
  collection: saved_items
  fields: user_id, type, target_id, created_at
  unique_index: user_id + type + target_id
  cursor_order: _id descending
