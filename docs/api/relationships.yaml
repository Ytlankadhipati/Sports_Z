  authorization: "Own connections only. Rows blocked BY SOMEONE ELSE are never returned."
  owner: M4
  screen_id: "C02, PR09"
  stub: "S-08"
request: "query {status?: comma list (requested,accepted,declined,blocked), limit 1..50, cursor}"
response: "200 [ConnectionView], meta.next_cursor"
errors: "401"
collections: "connections (M4)"
dependencies: "users, athlete_profiles (M1 read)"
tests_required: "user B never sees user A's connections; blocked-by-other hidden"

