# ============================================================
# SPORTSZ API CONTRACTS — M4 (CONNECTIONS, COACH LINKS, ACCESS GRANTS, MESSAGING, PRIVACY)
# Style follows docs/api/m1.yaml. One YAML document per contract, separated by '---'.
# GENERATED from the implemented routes in backend/app/modules/{relationships,messaging}.
#
# STATUS: DRAFT for team review. TODO(confirm) = not stated in the v3 doc; confirm vs v2.1 section 3.
# Conventions: /v1, envelope {data, meta{next_cursor, request_id}},
# errors {error{code, message, details, request_id}}.
# Common to every route: Authorization: Bearer <Firebase ID Token>; optional X-Active-Role
# (must be a role the user holds, else 403). Participant-only resources answer 404 (never 403)
# to non-participants, identical to a missing id (IDOR / enumeration safe).
# ============================================================

---
# ------------------------------------------------------------
# CONTRACT 1 — POST /v1/connections   (C01)
# ------------------------------------------------------------
contract:
  method: POST
  endpoint: /v1/connections
  auth: Bearer <Firebase ID Token>
  authorization: "Active role athlete|coach|recruiter, not platform-blocked. Target must exist; blocked either way -> 404."
  owner: M4
  screen_id: "C01"
  stub: "S-08"
request: "body {target_user_id: string, note?: string <=140 (platform_config limits.connection_note_max_chars)}"
response: "201 {id, status: requested, direction, counterpart{user_id,name,photo_url,role}, note}"
errors: "401 AUTH_REQUIRED; 403 FORBIDDEN (role/blocked user); 404 NOT_FOUND (missing OR blocked); 409 CONFLICT; 422 VALIDATION_ERROR; 429 RATE_LIMITED (limits.connection_requests_per_day)"
collections: "connections (M4)"
dependencies: "users, athlete_profiles (M1 read)"
tests_required: "note 141 -> 422; blocked == unknown id; duplicate -> 409"

---
